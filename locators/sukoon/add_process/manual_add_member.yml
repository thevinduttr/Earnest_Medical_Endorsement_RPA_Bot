  step3_next_button: "#step-3 button.nextBtn"

  # Upload section (step 4)
  supporting_document_input: "#supporting-document"
  upload_comments: "#divComments textarea"
  step4_reset_button: "#step-4 button:nth-of-type(2)"

  # Backward compatibility alias
  next_button: "#step-1 button.nextBtn"
