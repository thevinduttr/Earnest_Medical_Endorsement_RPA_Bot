  company_option_items: "div.dropdown-menu.open li a span.text"

  # Form fields
  principal_radio: "#form-membertype-selection > label:nth-of-type(2) > input"
  employee_number: "#form-employee-number"
  go_button: "#form-button-go"

  first_name: "#form-first-name"
  middle_name: "#form-middle-name"
  last_name: "#form-last-name"
  gender: "#form-gender"
  marital_status: "#form-marital-status"
  relationship: "#form-Relationship"
  date_of_birth: "#form-Date-of-birth"
  salary_band: "#form-salary-band"
  nationality: "#form-nationality"
  passport_number: "#form-input-passport"
  eid_number: "#form-input-eidNumber"
  unique_id_visa: "#form-input-uniqueid"
  visa_file_number: "#form-input-visaFileNumber"
  category: "#form-select-category"
  commission_based: "#form-select-personcommission"
  department: "#form-input-department"
  start_date: "#form-start-date"
  emirate_residence: "#form-emirate-residence"
