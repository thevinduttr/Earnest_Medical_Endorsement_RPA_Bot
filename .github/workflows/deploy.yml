name: Deploy Medical Endorsement Bot

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall main.py src tests

  deploy:
    name: Deploy to Windows Server
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Deploy over SSH
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          mkdir $env:USERPROFILE\.ssh -Force

          Write-Host "Writing SSH private key..."
          "${{ secrets.VM_SSH_KEY }}" | Out-File -FilePath $env:USERPROFILE\.ssh\id_ed25519 -Encoding ascii
          icacls $env:USERPROFILE\.ssh\id_ed25519 /inheritance:r
          icacls $env:USERPROFILE\.ssh\id_ed25519 /grant:r "$($env:USERNAME):F"

          Write-Host "Testing SSH connection..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $env:USERPROFILE\.ssh\id_ed25519 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo SSH connection successful"
          if ($LASTEXITCODE -ne 0) {
            throw "SSH connection test failed with exit code $LASTEXITCODE."
          }

          Write-Host "Starting remote deployment..."
          $remoteScript = @'
          $ErrorActionPreference = "Stop"

          Write-Host "[$(Get-Date -Format o)] Changing to project directory..."
          cd C:\Users\opc\Desktop\Portal_System

          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (!$git) {
            $gitPaths = @(
              "${env:ProgramFiles}\Git\cmd\git.exe",
              "${env:ProgramFiles}\Git\bin\git.exe",
              "${env:ProgramFiles(x86)}\Git\cmd\git.exe",
              "${env:ProgramFiles(x86)}\Git\bin\git.exe"
            )
            $git = $gitPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          } else {
            $git = $git.Source
          }
          if (!$git) {
            throw "git.exe was not found on the VM. Install Git for Windows or add git.exe to PATH for SSH sessions."
          }
          Write-Host "Using Git at: $git"

          Write-Host "[$(Get-Date -Format o)] Pulling latest code from dev..."
          & $git pull origin dev

          Write-Host "[$(Get-Date -Format o)] Checking virtual environment..."
          if (!(Test-Path .\venv\Scripts\python.exe)) {
            Write-Host "Virtual environment not found. Creating venv..."
            python -m venv venv
          }

          Write-Host "[$(Get-Date -Format o)] Upgrading pip..."
          .\venv\Scripts\python.exe -m pip install --upgrade pip

          Write-Host "[$(Get-Date -Format o)] Installing requirements..."
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

          Write-Host "[$(Get-Date -Format o)] Compiling Python files..."
          .\venv\Scripts\python.exe -m compileall main.py src tests

          Write-Host "[$(Get-Date -Format o)] Deployment completed."
          '@

          $encodedScript = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($remoteScript))
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $env:USERPROFILE\.ssh\id_ed25519 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "powershell -NoProfile -OutputFormat Text -ExecutionPolicy Bypass -EncodedCommand $encodedScript"
          if ($LASTEXITCODE -ne 0) {
            throw "Remote deployment failed with exit code $LASTEXITCODE."
          }
