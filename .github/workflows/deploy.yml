name: Deploy Medical Endorsement Bot

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall main.py src tests

  deploy:
    name: Deploy to Windows Server
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Deploy over SSH
        shell: powershell
        run: |
          mkdir $env:USERPROFILE\.ssh -Force

          "${{ secrets.VM_SSH_KEY }}" | Out-File -FilePath $env:USERPROFILE\.ssh\id_ed25519 -Encoding ascii
          icacls $env:USERPROFILE\.ssh\id_ed25519 /inheritance:r
          icacls $env:USERPROFILE\.ssh\id_ed25519 /grant:r "$env:USERNAME:F"

          ssh -o StrictHostKeyChecking=no -i $env:USERPROFILE\.ssh\id_ed25519 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "powershell -ExecutionPolicy Bypass -Command `"cd C:\Users\opc\Desktop\Portal_System; git pull origin dev; if (!(Test-Path .\venv\Scripts\python.exe)) { python -m venv venv }; .\venv\Scripts\python.exe -m pip install --upgrade pip; .\venv\Scripts\python.exe -m pip install -r requirements.txt; .\venv\Scripts\python.exe -m compileall main.py src tests; schtasks /End /TN MedicalEndorsementBot 2>`$null; schtasks /Run /TN MedicalEndorsementBot`""
