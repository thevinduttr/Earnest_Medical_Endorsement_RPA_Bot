name: Deploy Medical Endorsement Bot

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall main.py src tests

  deploy:
    name: Deploy to Windows Server
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Deploy over SSH
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          mkdir $env:USERPROFILE\.ssh -Force

          Write-Host "Writing SSH private key..."
          "${{ secrets.VM_SSH_KEY }}" | Out-File -FilePath $env:USERPROFILE\.ssh\id_ed25519 -Encoding ascii
          icacls $env:USERPROFILE\.ssh\id_ed25519 /inheritance:r
          icacls $env:USERPROFILE\.ssh\id_ed25519 /grant:r "$($env:USERNAME):F"

          Write-Host "Testing SSH connection..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $env:USERPROFILE\.ssh\id_ed25519 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo SSH connection successful"
          if ($LASTEXITCODE -ne 0) {
            throw "SSH connection test failed with exit code $LASTEXITCODE."
          }

          Write-Host "Starting remote deployment..."
          $remoteScript = @'
          $ErrorActionPreference = "Stop"

          Write-Host "[$(Get-Date -Format o)] Changing to project directory..."
          $projectPath = "C:\Users\opc\Desktop\Portal_System"
          $repoUrl = "https://github.com/thevinduttr/Earnest_Medical_Endorsement_RPA_Bot.git"

          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (!$git) {
            $gitPaths = @(
              "${env:ProgramFiles}\Git\cmd\git.exe",
              "${env:ProgramFiles}\Git\bin\git.exe",
              "${env:ProgramFiles(x86)}\Git\cmd\git.exe",
              "${env:ProgramFiles(x86)}\Git\bin\git.exe"
            )
            $git = $gitPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          } else {
            $git = $git.Source
          }
          if (!$git) {
            throw "git.exe was not found on the VM. Install Git for Windows or add git.exe to PATH for SSH sessions."
          }
          Write-Host "Using Git at: $git"

          if (!(Test-Path $projectPath)) {
            Write-Host "Project directory not found. Creating $projectPath..."
            New-Item -ItemType Directory -Path $projectPath -Force | Out-Null
          }

          if (!(Test-Path (Join-Path $projectPath ".git"))) {
            Write-Host "Project directory is not a Git repository. Cloning origin/dev..."
            $parentPath = Split-Path $projectPath -Parent
            $folderName = Split-Path $projectPath -Leaf
            if ((Get-ChildItem -Path $projectPath -Force | Select-Object -First 1)) {
              $backupPath = "$projectPath.backup.$(Get-Date -Format yyyyMMddHHmmss)"
              Write-Host "Existing non-Git directory is not empty. Moving it to $backupPath..."
              Move-Item -Path $projectPath -Destination $backupPath
            }
            cd $parentPath
            & $git clone --branch dev $repoUrl $folderName
            if ($LASTEXITCODE -ne 0) {
              throw "git clone failed."
            }
          }

          cd $projectPath

          Write-Host "[$(Get-Date -Format o)] Current repository state..."
          & $git remote -v
          & $git status --short --branch
          & $git rev-parse HEAD

          Write-Host "[$(Get-Date -Format o)] Fetching latest code from origin..."
          & $git fetch origin dev
          if ($LASTEXITCODE -ne 0) {
            throw "git fetch origin dev failed."
          }

          Write-Host "[$(Get-Date -Format o)] Checking out dev..."
          & $git checkout dev
          if ($LASTEXITCODE -ne 0) {
            throw "git checkout dev failed."
          }

          Write-Host "[$(Get-Date -Format o)] Resetting VM working tree to origin/dev..."
          & $git reset --hard origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "git reset --hard origin/dev failed."
          }

          Write-Host "[$(Get-Date -Format o)] Deployed repository state..."
          & $git status --short --branch
          & $git log -1 --oneline

          Write-Host "[$(Get-Date -Format o)] Checking virtual environment..."
          if (!(Test-Path .\venv\Scripts\python.exe)) {
            Write-Host "Virtual environment not found. Creating venv..."
            python -m venv venv
          }

          Write-Host "[$(Get-Date -Format o)] Upgrading pip..."
          .\venv\Scripts\python.exe -m pip install --upgrade pip

          Write-Host "[$(Get-Date -Format o)] Installing requirements..."
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

          Write-Host "[$(Get-Date -Format o)] Compiling Python files..."
          .\venv\Scripts\python.exe -m compileall main.py src tests

          Write-Host "[$(Get-Date -Format o)] Deployment completed."
          '@

          $localScriptPath = Join-Path $env:RUNNER_TEMP "deploy.ps1"
          $remoteScriptPath = "C:\Users\${{ secrets.VM_USER }}\AppData\Local\Temp\deploy.ps1"
          $remoteTarget = "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"

          Write-Host "Uploading deployment script..."
          $remoteScript | Out-File -FilePath $localScriptPath -Encoding utf8
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $env:USERPROFILE\.ssh\id_ed25519 $localScriptPath "${remoteTarget}:$remoteScriptPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload deployment script with exit code $LASTEXITCODE."
          }

          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $env:USERPROFILE\.ssh\id_ed25519 $remoteTarget "powershell -NoProfile -ExecutionPolicy Bypass -File `"$remoteScriptPath`""
          if ($LASTEXITCODE -ne 0) {
            throw "Remote deployment failed with exit code $LASTEXITCODE."
          }
