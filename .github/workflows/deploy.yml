name: Deploy Medical Endorsement Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall main.py src tests

  deploy:
    name: Deploy to Windows Bot Server
    needs: validate
    runs-on: [self-hosted, Windows, X64]

    env:
      DEPLOY_PATH: C:\Users\opc\Documents\Algospring\Medical_Endorsement

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure deploy folders exist
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_PATH"
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_PATH\config\env"
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_PATH\data\logs"
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_PATH\data\attachments"
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_PATH\data\browser_profiles"

      - name: Copy application files
        shell: powershell
        run: |
          robocopy "$env:GITHUB_WORKSPACE" "$env:DEPLOY_PATH" /MIR `
            /XD ".git" ".github" "venv" ".venv" "__pycache__" `
                "data\logs" "data\attachments" "data\browser_profiles" "config\env" `
            /XF "*.pyc" "*.pyo" "*.log" `
            /R:2 /W:2

          if ($LASTEXITCODE -le 7) {
            exit 0
          }

          exit $LASTEXITCODE

      - name: Create virtual environment
        shell: powershell
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          if (!(Test-Path ".\venv\Scripts\python.exe")) {
            python -m venv venv
          }

      - name: Install production dependencies
        shell: powershell
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Verify deployed code
        shell: powershell
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          .\venv\Scripts\python.exe -m compileall main.py src tests
