bot_details:
  name: "Sukoon Medical Bot"
  version: "1.0.0"
  id: "1"

paths:
  base_url: "https://medical.sukoon.com/"

browser:
  headless: false
  engine: "msedge"
  channel: "msedge"
  persistent_context: true
  user_data_dir: "data/browser_profiles/sukoon"
  viewport:
    width: 1920
    height: 945

worker:
  poll_interval_seconds: 10
  failure_sleep_seconds: 2
  loop_sleep_seconds: 0.2
  clear_attachments_each_cycle: true

