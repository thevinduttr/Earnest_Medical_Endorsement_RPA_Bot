login:
  username: //*[@id=//label[normalize-space()='Username']/@for]
  password: //*[@id=//label[normalize-space()='Password']/@for]
  submit: //button[normalize-space()='Login']
  password_expired_selector: div.validation-summary-errors.alert.alert-danger
  password_expired_text: Your password has expired. Please reset it to continue.

  start_new_session_button: (//button[contains(@class,'btn-primary') and normalize-space()='Start New Session'])[1]