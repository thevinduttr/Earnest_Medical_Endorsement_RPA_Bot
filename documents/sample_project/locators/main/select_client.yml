select_client:
  modal : (//span[contains(@class,'ui-dialog-title') and .//span[contains(@class,'fa-user')] and contains(normalize-space(.),'Client')])[1]

  advanced_search_button: (//button[normalize-space()='Advance Search'])[1]

  select_client_button: "(//button[contains(@class,'btn-info') and (normalize-space()='Select Client' or normalize-space()='Search Client')])[1]"

  search_client_name: "//input[@name='ClientSearch.ClientName']"
  search_emirates_id: "(//label[contains(text(),'Emirate Id')]/following::input[1])[last()]"
  search_mobile_number: "//input[@name='ClientSearch.MobileNo']"
  search_email_id: "//input[@name='ClientSearch.EmailId']"
  search_button: "(//button[normalize-space()='Search'])[1]"

  clear_button: "(//button[normalize-space()='Clear'])[1]"

  select_button: "(//button[contains(@class,'btn-system') and normalize-space()='Select'])[1]"

  close_tab_button: (//span[normalize-space()='Remove Tab' and contains(@class,'ui-icon-close')])[1]
